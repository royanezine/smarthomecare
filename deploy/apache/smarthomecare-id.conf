# VirtualHost: https://smarthomecare.citrasolusi.id
# Single domain - semuanya di satu domain:
#   /        -> Portal Next.js (reverse proxy ke port 3011)
#   /cms/    -> CMS Admin (file statis build Vite)
#   /api/*   -> Laravel API (PHP-FPM)  -> smarthomecare.citrasolusi.id/api
#   /sanctum -> Laravel Sanctum (csrf-cookie)
#   /storage -> File storage Laravel
#   /ws      -> Go WebSocket (proxy wss ke port 8088)

<VirtualHost *:80>
    ServerName smarthomecare.citrasolusi.id

    Redirect permanent / https://smarthomecare.citrasolusi.id/
</VirtualHost>

<VirtualHost *:443>
    ServerName smarthomecare.citrasolusi.id

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smarthomecare.citrasolusi.id/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smarthomecare.citrasolusi.id/privkey.pem

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On

    # ============================================================
    # CMS Admin - file statis build Vite
    # ============================================================
    Alias /cms/ /var/www/smarthomecare/cms/
    <Directory /var/www/smarthomecare/cms>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
        RewriteOptions Inherit
        # SPA fallback untuk React Router
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /cms/index.html [R=302,L]
    </Directory>

    # ============================================================
    # Storage Laravel (gambar / file) -> api/public/storage
    # ============================================================
    Alias /storage/ /var/www/smarthomecare/api/public/storage/
    <Directory /var/www/smarthomecare/api/public/storage>
        Options -Indexes
        Require all granted
    </Directory>

    # ============================================================
    # Laravel API - semua /api & /sanctum ke front controller Laravel
    # ============================================================
    RewriteRule ^api/(.*)$ /var/www/smarthomecare/api/public/index.php [QSA,L]
    RewriteRule ^sanctum(.*)$ /var/www/smarthomecare/api/public/index.php [QSA,L]

    <FilesMatch "index\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/smarthomecare/api/public>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # ============================================================
    # WebSocket Go - proxy wss://smarthomecare.citrasolusi.id/ws
    # ============================================================
    RewriteCond %{HTTP:UPGRADE} =websocket [NC]
    RewriteRule ^ws(/.*)?$ "wss://127.0.0.1:8088/ws$1" [P,L]
    RewriteRule ^ws$ "wss://127.0.0.1:8088/ws" [P,L]

    # ============================================================
    # Portal Next.js - default rute, reverse proxy ke port 3011
    # ============================================================
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/

    ErrorLog ${APACHE_LOG_DIR}/smarthomecare-error.log
    CustomLog ${APACHE_LOG_DIR}/smarthomecare-access.log combined
</VirtualHost>